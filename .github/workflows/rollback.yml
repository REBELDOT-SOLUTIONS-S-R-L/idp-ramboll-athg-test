name: Roll back production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing immutable release tag, for example 1.2.3
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Validate request and resolve infrastructure
        id: request
        shell: bash
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          valid=true
          if ! printf '%s' "$TARGET_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Version must be a stable semantic release such as 1.2.3, without leading zeroes or empty identifiers." >&2
            valid=false
          fi
          app=$(sed -E -n 's/^app_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' iac/infra/terraform.tfvars)
          resource_group=$(sed -E -n 's/^resource_group_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' iac/infra/terraform.tfvars)
          if ! printf '%s' "$app" | grep -Eq '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'; then
            echo "app_name is missing or invalid in iac/infra/terraform.tfvars." >&2
            valid=false
          fi
          if ! printf '%s' "$resource_group" | grep -Eq '^[a-z0-9][a-z0-9-]{1,88}[a-z0-9]$'; then
            echo "resource_group_name is missing or invalid in iac/infra/terraform.tfvars." >&2
            valid=false
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "APP_NAME=$app" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$resource_group" >> "$GITHUB_ENV"

      - name: Authenticate to Azure
        if: steps.request.outputs.valid == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify immutable image digest
        if: steps.request.outputs.valid == 'true'
        id: image
        shell: bash
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          digest=$(az acr repository show \
            --name "${{ vars.AZURE_ACR_NAME }}" \
            --image "${{ github.event.repository.name }}:$TARGET_VERSION" \
            --query digest -o tsv 2>/dev/null || true)
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "The requested immutable image does not exist in ACR." >&2
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target_image="${{ vars.AZURE_ACR_NAME }}.azurecr.io/${{ github.event.repository.name }}@$digest"
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "TARGET_IMAGE=$target_image" >> "$GITHUB_ENV"
          echo "Verified $target_image."

      - name: Register rollback deployment
        if: always()
        id: deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          TARGET_VERSION: ${{ inputs.version }}
          TARGET_DIGEST: ${{ steps.image.outputs.digest || 'unverified' }}
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: `Rollback production to ${process.env.TARGET_VERSION}`,
              payload: {
                version: process.env.TARGET_VERSION,
                digest: process.env.TARGET_DIGEST,
                rollback: true,
              },
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: data.id,
              state: 'in_progress',
            });
            return data.id;

      - name: Require verified rollback target
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.request.outputs.valid }}" = "true" || { echo "Rollback request validation failed." >&2; exit 1; }
          test "${{ steps.image.outputs.verified }}" = "true" || { echo "Rollback image verification failed." >&2; exit 1; }

      - name: Deploy and verify rollback target
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          revision_mode=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.activeRevisionsMode -o tsv)
          test "$revision_mode" = "Single" || { echo "Rollback supports only the template's Single revision mode; traffic was not changed." >&2; exit 1; }

          previous_image=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)
          previous_revision=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          echo "PREVIOUS_IMAGE=$previous_image" >> "$GITHUB_ENV"

          current_ref=${previous_image#*.azurecr.io/}
          current_digest=$(az acr repository show --name "${{ vars.AZURE_ACR_NAME }}" --image "$current_ref" --query digest -o tsv 2>/dev/null || true)
          if [ "$current_digest" = "${{ steps.image.outputs.digest }}" ]; then
            state=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$previous_revision" --query properties.runningState -o tsv 2>/dev/null || true)
            health=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$previous_revision" --query properties.healthState -o tsv 2>/dev/null || true)
            test "$state" = "Running" && test "$health" = "Healthy" || { echo "Target digest is active but its revision is not healthy." >&2; exit 1; }
            echo "Requested digest is already active and healthy; no Azure update is needed."
            exit 0
          fi

          echo "MUTATED=true" >> "$GITHUB_ENV"
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$TARGET_IMAGE"
          revision=""
          for attempt in $(seq 1 30); do
            revision=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
            if [ -n "$revision" ] && [ "$revision" != "$previous_revision" ]; then break; fi
            revision=""
            echo "Waiting for rollback revision ($attempt/30)."
            sleep 5
          done
          test -n "$revision" || { echo "No revision was created for $TARGET_IMAGE." >&2; exit 1; }

          for attempt in $(seq 1 30); do
            state=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$revision" --query properties.runningState -o tsv 2>/dev/null || true)
            health=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$revision" --query properties.healthState -o tsv 2>/dev/null || true)
            if [ "$state" = "Running" ] && [ "$health" = "Healthy" ]; then
              echo "Rollback revision $revision is healthy."
              exit 0
            fi
            if [ "$state" = "Failed" ] || [ "$health" = "Unhealthy" ]; then break; fi
            sleep 10
          done
          echo "Rollback target did not become healthy." >&2
          exit 1

      - name: Restore previous healthy image
        if: failure() && steps.apply.outcome == 'failure' && env.MUTATED == 'true' && env.PREVIOUS_IMAGE != ''
        shell: bash
        run: |
          set -euo pipefail
          failed_revision=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$PREVIOUS_IMAGE"
          restored_revision=""
          for attempt in $(seq 1 30); do
            restored_revision=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.latestRevisionName -o tsv)
            if [ -n "$restored_revision" ] && [ "$restored_revision" != "$failed_revision" ]; then break; fi
            restored_revision=""
            echo "Waiting for restoration revision ($attempt/30)."
            sleep 5
          done
          test -n "$restored_revision" || { echo "Restoring the previous image did not create a revision." >&2; exit 1; }
          for attempt in $(seq 1 30); do
            state=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$restored_revision" --query properties.runningState -o tsv 2>/dev/null || true)
            health=$(az containerapp revision show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$restored_revision" --query properties.healthState -o tsv 2>/dev/null || true)
            if [ "$state" = "Running" ] && [ "$health" = "Healthy" ]; then
              echo "Previous image restored as healthy revision $restored_revision."
              exit 0
            fi
            sleep 10
          done
          echo "Previous image could not be restored to a healthy revision." >&2
          exit 1

      - name: Complete rollback deployment
        if: always() && steps.deployment.outputs.result != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(${{ steps.deployment.outputs.result }}),
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              description: '${{ job.status }}' === 'success'
                ? 'Rollback target is healthy'
                : 'Rollback failed; inspect validation and restoration steps',
            });
