name: Sync secrets

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: secrets-${{ github.repository }}
  cancel-in-progress: false

env:
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Resolve declared secret names
        id: names
        run: |
          set -euo pipefail
          enabled="$(sed -E -n 's/^enable_secrets[[:space:]]*=[[:space:]]*(true|false).*/\1/p' iac/infra/terraform.tfvars)"
          echo "enabled=${enabled:-false}" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "Secrets is off for this app; no Key Vault to sync or prune."
            exit 0
          fi
          # terraform.tfvars is the one place secret names are declared; nothing else to keep in sync.
          # An empty declared list is valid (Secrets on, nothing named yet, or everything just
          # removed) -- the sync step still needs to run in that case to prune the vault down to
          # nothing, so it is not gated on this list being non-empty.
          line="$(grep -E '^secret_names' iac/infra/terraform.tfvars || true)"
          mapfile -t names < <(printf '%s' "$line" | grep -oE '"[A-Z][A-Z0-9_]{0,62}"' | tr -d '"' || true)
          printf '%s\n' "${names[@]}" > /tmp/secret-names.txt

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        if: steps.names.outputs.enabled == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sync each declared secret from GitHub into Key Vault
        if: steps.names.outputs.enabled == 'true'
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          app="$(sed -E -n 's/^app_name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' iac/infra/terraform.tfvars)"
          test -n "$app" || { echo "Could not read app_name from iac/infra/terraform.tfvars" >&2; exit 1; }
          compact="$(printf '%s' "$app" | tr -d '-' | cut -c1-14)"
          suffix="$(printf '%s' "$app" | md5sum | cut -c1-6)"
          vault="kv-${compact}-${suffix}"

          missing=0
          declared_kv_names=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            declared_kv_names+=("$(echo "$name" | tr '[:upper:]_' '[:lower:]-')")
            value="$(echo "$SECRETS_CONTEXT" | jq -r --arg k "$name" '.[$k] // empty')"
            if [ -z "$value" ]; then
              echo "::warning::GitHub secret '$name' is not set yet on this repo (gh secret set $name). Skipping; the app will keep its placeholder value until it is."
              missing=$((missing + 1))
              continue
            fi
            kv_name="$(echo "$name" | tr '[:upper:]_' '[:lower:]-')"
            # infra.yml and this workflow both trigger on the same push, in no guaranteed order --
            # the role granting this identity write access to the vault is created by infra.yml,
            # so a fresh vault's grant may still be propagating. Retry rather than fail outright.
            synced=false
            for attempt in $(seq 1 6); do
              if az keyvault secret set --vault-name "$vault" --name "$kv_name" --value "$value" --output none 2>/tmp/kv-error; then
                synced=true
                break
              fi
              echo "Setting $name failed ($attempt/6); the vault's access grant may still be propagating. Retrying in 30s."
              sleep 30
            done
            if [ "$synced" != "true" ]; then
              cat /tmp/kv-error >&2
              echo "::error::Could not set $name after 6 attempts (3 minutes). If Infra apply for this app hasn't finished yet, wait for it and re-run this workflow." >&2
              exit 1
            fi
            echo "Synced $name -> $vault/$kv_name (Container Apps refreshes the running revision automatically within ~30 minutes)."
          done < /tmp/secret-names.txt

          if [ "$missing" -gt 0 ]; then
            echo "$missing declared secret(s) still need a value: run 'gh secret set NAME --repo ${{ github.repository }}' for each, then re-run this workflow."
          fi

          # Terraform no longer owns these objects (see iac/infra/main.tf), so removing a name
          # from secret_names only takes effect if this workflow deletes it too. Deletion is a
          # soft-delete: re-declaring the same name before the retention window elapses will fail
          # with "secret is in a soft-deleted state" on the next set, needing a manual recover or
          # purge -- acceptable for a rare rename/typo-fix, not handled automatically here.
          mapfile -t existing_kv_names < <(az keyvault secret list --vault-name "$vault" --query "[].name" -o tsv)
          for existing in "${existing_kv_names[@]}"; do
            [ -n "$existing" ] || continue
            still_declared=false
            for declared in "${declared_kv_names[@]+"${declared_kv_names[@]}"}"; do
              if [ "$existing" = "$declared" ]; then
                still_declared=true
                break
              fi
            done
            if [ "$still_declared" != "true" ]; then
              echo "Deleting $vault/$existing (no longer declared in iac/infra/terraform.tfvars)."
              az keyvault secret delete --vault-name "$vault" --name "$existing" --output none
            fi
          done
